<a (click)="navigateToEventDetails(event.id)">
  <div class="event-card">
    <div [ngSwitch]="event.category">
      <img *ngSwitchCase="'Piłka nożna'" style="border-bottom: 4px solid var(--zielony);"
        src="assets/images/football.jpg" alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Piłka siatkowa'" style="border-bottom: 4px solid var(--zielony);"
        src="assets/images/volleyball.jpg" alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Koszykówka'" style="border-bottom: 4px solid var(--zielony);"
        src="assets/images/basketball.jpg" alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Dart'" style="border-bottom: 4px solid var(--zielony);" src="assets/images/dart.jpg"
        alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Curling'" style="border-bottom: 4px solid var(--zielony);" src="assets/images/curling.jpg"
        alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Koncert POP'" style="border-bottom: 4px solid var(--zielony);"
        src="assets/images/concert.jpg" alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Koncert rockowy'" style="border-bottom: 4px solid var(--zielony);"
        src="assets/images/rockConcert.jpg" alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Koncert rapowy'" style="border-bottom: 4px solid var(--zielony);" src="assets/images/rap.jpg"
        alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Impreza techno'" style="border-bottom: 4px solid var(--zielony);"
        src="assets/images/wixa.jpg" alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Wystawa sztuki'" style="border-bottom: 4px solid var(--zielony);"
        src="assets/images/wystawa.jpg" alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchCase="'Teatr'" style="border-bottom: 4px solid var(--zielony);" src="assets/images/teatr.jpg"
        alt="Zdjęcie wydarzenia" class="img-fluid mb-4">
      <img *ngSwitchDefault src="assets/images/default.jpg" style="border-bottom: 4px solid var(--zielony);" alt="Zdjęcie domyślne" class="img-fluid mb-4">
    </div>
    <div class="event-details">
      <div class="event-name font-weight-bold mb-4">{{event.eventName}}</div>
      <div class="mb-3"><a style="font-weight: bold;">Miejsce:</a> {{event.location}}</div>
      <div class="mb-2"><a style="font-weight: bold;">Data:</a> {{event.date | date:'dd/MM/yy HH:mm'}} </div>
    </div>
    <div class="event-price p-3">
      <div *ngIf="isSoldOut()" style="margin-top: 10px; color: red;">SOLD OUT</div>
      <div *ngIf="!isSoldOut()" style="margin-top: 10px;">{{event.ticketPrice | currency: 'zł'}}</div>
    </div>
  </div>
</a>
